
<!DOCTYPE html>
<html>
<head>
    <title>Staff Portal Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eee;
        }

        .container {
            display: flex;
            height: 95vh;
            margin: 20px 10px 10px;
        }

        .left {
            width: 60%;
            background: linear-gradient(rgba(10, 25, 60, 0.7),
                        rgba(10, 25, 60, 0.7)),
                        url("campus.jpg");
            background-size: cover;
            background-position: center;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
        }

        .left h1 {
            font-size: 35px;
        }

        .right {
            width: 40%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            width: 75%;
        }

        .login h2 {
            margin-bottom: 5px;
        }

        label {
            display: block;
            margin-top: 20px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .remember {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            margin: 15px 0;
        }

        .remember input {
            width: auto;
        }

        a {
            color: #0785ff;
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0785ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .container {
                height: auto;
                flex-direction: column;
            }

            .left, .right {
                width: auto;
            }

            .left {
                height: 300px;
            }

            .right {
                padding: 40px 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">
        <h1>Empowering residents<br>through learning.</h1>
        <p>Organizing training programs and building a stronger community.</p>
    </div>

    <div class="right">
        <div class="login">
            <small style="color: blue;">STAFF PORTAL</small>

            <h2>Welcome back</h2>
            <p>Sign in to the Training and Seminar Management System.</p>

            <form>
                <label>Username</label>
                <input type="text" placeholder="Enter username" required>

                <label>Password</label>
                <input type="password" placeholder="Enter password" required>

                <div class="remember">
                    <span>
                        <input type="checkbox" checked>
                        Remember me
                    </span>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Submit in portal &gt;</button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
